schema:
  schema_id: translate_type
  name: 方寸全拼
  version: '0.4.2'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors: [speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/^([a-z]+)$/\U$1/
    - derive/^([a-z])/\U$1/
translator:
  dictionary: translate_type
  user_dict: pinyin_simp
  enable_user_dict: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
menu:
  page_size: 5
navigator:
  bindings:
    Left: left_by_char_no_loop
    Right: right_by_char_no_loop
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
    '(': '（'
    ')': '）'
